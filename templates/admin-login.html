<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet"  href="{{ url_for('static', filename='css/admin-login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
          integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Admin Panel</title>
</head>
<body>
        <header class="login">
            <h2>admin <span>login</span></h2>
            <nav>
                <ul class="login-links">
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/">Home</a></li>
                </ul>
            </nav>
        </header>

    <div id="flashed2" class="flashed2">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <p> {{ messages[0] }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>


        <div class="formular">
            <form method="POST" action="/admin-login" >
                <input type="password" name="password" placeholder="Admin-Pass" required><br>
                <button type="submit">Login</button>
            </form>
        </div>
        <script>
            setTimeout(function() {
                const msg = document.getElementById("flashed2");
                if (msg) {
                    msg.style.transition = "opacity 0.5s ease";
                    msg.style.opacity = 0;
                    setTimeout(() => msg.remove(), 500);
                }
            }, 2000);
        </script>



</body>
</html>
